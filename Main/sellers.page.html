<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SokoHub -Seller's Registration page</title>
    <link rel="stylesheet" href="./seller.css">
</head>
<body>
    <nav>
        <img src="./sokohubimg/sokohub logo.jpg" alt="">
        <section id="logo"></section>
        <section id="home">
            <a href="./index.html">Home</a></section>
        <section id="products">
            <a href="./products.html">our products</a></section>
        <section id="about">
            <a href="./About.html">about us</a>
        </section>
        <section id="contact">
            <a href="./Contact us.html">contact us</a>
        </section>
         <section id="buttons">
            <a href="./Register.html"><button id="up">Register</button></a>
            <a href="./Login&Signup/login.html"><button id="in">sign in </button></a>
        </section>
    </nav>
    
    <div id="flex">

        <!--Hero Content -->
        <div class="hero">
            <h1><span class="soko">Soko</span><span class="hub">Hub</span></h1>

            <!-- Seller Welcome Message -->
            <p>Become a Sokohub Vendor!</p>
            <p>Join our marketplace, connect with thousands of customers, and grow your business today.</p>
        </div>

        <!--Seller Registration Form-->
            <h2>Create Your Seller Account</h2>
            <p class="register">Tell us about your business to get started selling on Sokohub.</p>

            <form action="#" class="login-box">
                    <!-- Business Name Field -->
                    
                        <label for="businessName" class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
                        <input type="text" id="businessName" name="businessName" required placeholder="e.g. Ian's Fresh Produce">
                    <!--Business Type Field-->
                        <label for="businessType">Type of Business</label>
                        <select id="businessType" name="businessType" required type="name">
                            <option value="" disabled selected>Select a category</option>
                            <option value="retail">Retail/General Goods</option>
                            <option value="food_beverage">Food & Beverage</option>
                            <option value="crafts">Handmade/Crafts</option>
                            <option value="services">Service Provider</option>
                            <option value="other">Other</option>
                        </select>
                    <!-- Email Field -->
                        <label for="email">Official Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="business@example.com">
                    <!-- Phone Number Field -->
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required placeholder="e.g. +254 7XX XXX XXX">
                    <!-- Password Field -->
                        <label for="password">Create Password</label>
                        <input type="password" id="password" name="password" required placeholder="Minimum 8 characters">
                    <!-- Confirm Password Field-->
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your password">
                

                <!-- Terms and Conditions Checkbox -->
                    <input id="terms" name="terms" type="checkbox" required>
                    <label for="terms">
                        I agree to the 
                        <a href="#">Terms of Service</a> and 
                        <a href="#">Privacy Policy</a>.
                    </label>
                

                <!-- Registration Button -->
                <div class="reg">
                    <button class="submit">
                        <div class="reg2">
                            <a href="SOKOHUB.html">Register and start selling</a>
                        </div>
                
                    </button>
                </div>
            </form>

            <!-- Login Link -->
            <p class="sign-in"> Already have a seller account?<a href="./Login&Signup/login.html">Sign In Here</a> </p> 
               
    </div>
</body>
</html>
