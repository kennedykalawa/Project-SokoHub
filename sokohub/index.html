<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: 'Arial', sans-serif;
        }
        nav{
            display: flex;
            width: 100%;
            height: 50px;
            color: white;
            background-color: limegreen;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        img{
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 150px;
            height: 50px;
        }
        #home, #products, #about, #contact, #in, #out{
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 150px;
            height: 50px;
        }
        #home:focus, #products:focus, #about:focus, #contact:focus, #in:focus{
            background-color: orangered;
            color: white;
        }
        #home:hover, #products:hover, #about:hover, #contact:hover, #in:hover{
            background-color: #87CEEB;
            color: white;
            padding: 0;
        }
        #in{
            width: 90px;
            height: 50px;
            padding: 0;
        }
    </style>
</head>
<body>
    <nav>
        <img src="sokohub logo.jpg" alt="">
        <section id="logo"></section>
        <section id="home">home</section>
        <section id="products">our products</section>
        <section id="about">about us</section>
        <section id="contact">cotact us</section>
        <section id="in">sign in</section>
    </nav>
    <div id="main">
        
    </div>
</body>
</html>
